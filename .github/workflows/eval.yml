name: Evaluate PediJev prompts

on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "pipeline/**"
      - "data/golden_dataset.json"
      - "eval/**"
  pull_request:
    paths:
      - "prompts/**"
      - "pipeline/**"
      - "data/golden_dataset.json"
      - "eval/**"
  workflow_dispatch:
    inputs:
      fail_under:
        description: "Minimum accuracy percent required (0 = report-only, never fail)"
        required: false
        default: "0"

jobs:
  unit-tests:
    # Fast, free, no API key: decision-logic and arbitration-logic
    # correctness. Runs on every push regardless of what changed, since
    # both modules are pure Python with no live dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run decide() unit tests
        run: python pipeline/test_pediev_pipeline.py -v
      - name: Run arbitration engine unit tests
        run: python pipeline/test_arbitration.py -v
      - name: Run L2 rolling-buffer unit tests
        run: python pipeline/test_l2_buffer.py -v
      - name: Run L3 assistant unit tests (mocked, no API key needed)
        run: python pipeline/test_l3_assistant.py -v
      - name: Run L3/arbitration integration tests
        run: python pipeline/test_stream_l3_integration.py -v

  evaluate:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run evaluation against the golden dataset
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python eval/run_eval.py --fail-under "${{ inputs.fail_under || '0' }}"

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('eval/results.json', 'utf8'));
            let body = '## PediJev prompt evaluation\n\n| Prompt | Accuracy | Confidently wrong | Honestly escalated | Avg latency/image |\n|---|---|---|---|---|\n';
            for (const r of results) {
              const wrong = r.per_image.filter(p => !p.agree && !p.escalated).map(p => p.image_id);
              const escalated = r.per_image.filter(p => !p.agree && p.escalated).map(p => p.image_id);
              const lat = r.avg_latency_s !== null && r.avg_latency_s !== undefined ? `${r.avg_latency_s}s` : '-';
              body += `| \`${r.prompt_path}\` | ${r.correct}/${r.total} (${r.accuracy_pct}%) | ${r.confidently_wrong} (${wrong.join(', ') || '-'}) | ${r.honestly_escalated} (${escalated.join(', ') || '-'}) | ${lat} |\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
